name: boot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build with warnings as errors
        run: |
          gcc -O2 -Wall -Wextra -Werror -pthread -o vmmlite vmmlite.c
          gcc -O2 -Wall -Wextra -Werror -static -o init ../init.c
          echo init | cpio -o -H newc > initramfs.cpio

      - name: Boot the runner's own kernel
        run: |
          sudo install -m 644 "/boot/vmlinuz-$(uname -r)" bzImage
          timeout 120 ./vmmlite bzImage initramfs.cpio | tee boot.log
          grep -q 'Hello from PID 1!' boot.log
