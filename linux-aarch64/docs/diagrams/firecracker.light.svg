 exits</text></g><g data-id="node:devices"><rect x="680" y="375" width="480" height="135" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="680" y="387" width="5" height="111" rx="2.5" fill="#fbbf24"/><text x="920.0" y="422.6" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Device backends</text><text x="920.0" y="449.5" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Block, network and vsock</text><text x="920.0" y="475.8" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">I/O rate limiting</text></g><g data-id="node:guest"><rect x="40" y="630" width="480" height="135" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="40" y="642" width="5" height="111" rx="2.5" fill="#8b949e"/><text x="280.0" y="677.6" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Guest microVM</text><text x="280.0" y="704.5" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Kernel and applications</text><text x="280.0" y="730.8" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">One or more vCPUs</text></g><g data-id="node:security"><rect x="680" y="630" width="480" height="135" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="680" y="642" width="5" height="111" rx="2.5" fill="#db61a2"/><text x="920.0" y="677.6" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Jailer and seccomp</text><t