<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="The Windows process owns RAM and PC devices; WHP supplies VP 0, the local APIC and GPA mappings."><title>Machine · who supplies each part</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d828b"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#00b0f0" flood-opacity="0.3"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" fill="#f6f5f1"/><text x="40.0" y="56.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="600" fill="#111111">Machine · who supplies each part</text><text x="1160.0" y="874.0" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#5f6368">vmmlite · WHP source 4b049e4d · native boot pending</text><rect data-id="boundary:process" x="40" y="110" width="480" height="665" rx="16" fill="#fff9e9" stroke="#fde29c" stroke-width="1.5"/><text x="60.0" y="144.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#8a6914">vmmlite.exe</text><rect data-id="boundary:engine" x="680" y="110" width="480" height="665" rx="16" fill="#ebfbf5" stroke="#a4ebd1" stroke-width="1.5"/><text x="700.0" y="144.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d7454">WHP + hypervisor</text><path data-id="edge:run_vp" d="M490,260 L710,260" fill="none" stroke="#7d828b" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:request_irq" d="M490,480 L710,480" fill="none" stroke="#7d828b" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:map_ram" d="M490,690 L710,690" fill="none" stroke="#7d828b" stroke-width="2" marker-end="url(#arrow)"/><g data-id="node:run"><rect x="70" y="200" width="420" height="120" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="70" y="212" width="5" height="96" rx="2.5" fill="#fbbf24"/><text x="280.0" y="240.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">VP run loop</text><text x="280.0" y="267.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Load Linux; run VP 0</text><text x="280.0" y="293.3" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Handle exits on this thread</text></g><g data-id="node:devices"><rect x="70" y="410" width="420" height="140" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="70" y="422" width="5" height="116" rx="2.5" fill="#fbbf24"/><text x="280.0" y="460.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">PC devices + console</text><text x="280.0" y="487.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">PIC / PIT / IOAPIC</text><text x="280.0" y="513.3" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">COM1 / virtio → stdout</text></g><g data-id="node:ram"><rect x="70" y="640" width="420" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="70" y="652" width="5" height="76" rx="2.5" fill="#db61a2"/><text x="280.0" y="683.2" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">512 MiB RAM</text><text x="280.0" y="710.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Windows allocation</text></g><g data-id="node:vp"><rect x="710" y="200" width="420" height="120" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="710" y="212" width="5" height="96" rx="2.5" fill="#fbbf24"/><text x="920.0" y="240.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Virtual processor 0</text><text x="920.0" y="267.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Executes Linux + /init</text><text x="920.0" y="293.3" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Retains guest registers</text></g><g data-id="node:lapic"><rect x="710" y="410" width="420" height="140" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="710" y="422" width="5" height="116" rx="2.5" fill="#fbbf24"/><text x="920.0" y="460.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Local APIC + timer</text><text x="920.0" y="487.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">xAPIC emulation</text><text x="920.0" y="513.3" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Delivers CPU vectors</text></g><g data-id="node:mapping"><rect x="710" y="640" width="420" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="710" y="652" width="5" height="76" rx="2.5" fill="#db61a2"/><text x="920.0" y="683.2" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">GPA mappings</text><text x="920.0" y="710.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Guest addresses → host pages</text></g><rect x="527.0" y="241.3" width="146.0" height="37.3" rx="6" fill="#f6f5f1"/><text x="600.0" y="267.3" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#3d4148">run / exit</text><rect x="545.9" y="461.4" width="108.2" height="37.3" rx="6" fill="#f6f5f1"/><text x="600.0" y="487.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#3d4148">vectors</text><rect x="545.9" y="671.4" width="108.2" height="37.3" rx="6" fill="#f6f5f1"/><text x="600.0" y="697.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#3d4148">map RAM</text><text x="40.0" y="815.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#5f6368">Key</text><rect x="40.0" y="833" width="18" height="18" rx="4" fill="#fbbf24"/><text x="70.0" y="849.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111">Execution</text><rect x="201.95" y="833" width="18" height="18" rx="4" fill="#34d399"/><text x="231.9" y="849.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111">Compute</text><rect x="363.9" y="833" width="18" height="18" rx="4" fill="#db61a2"/><text x="393.9" y="849.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111">State</text></svg>