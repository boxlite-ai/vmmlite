<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="A run uses a partition handle and VP index, then fills a caller-owned exit context. The VP retains its registers."><title>WHP API · inputs and returned context</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d828b"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#00b0f0" flood-opacity="0.3"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".08"/></filter></defs><rect width="100%" height="100%" fill="#f6f5f1"/><text x="40.0" y="56.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="600" fill="#111111">WHP API · inputs and returned context</text><text x="1160.0" y="754.0" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#5f6368">vmmlite · WHP source 4b049e4d · native boot pending</text><rect data-id="boundary:caller" x="40" y="120" width="520" height="530" rx="16" fill="#fff9e9" stroke="#fde29c" stroke-width="1.5"/><text x="60.0" y="154.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#8a6914">vmmlite.exe</text><rect data-id="boundary:whp" x="640" y="120" width="520" height="530" rx="16" fill="#ebfbf5" stroke="#a4ebd1" stroke-width="1.5"/><text x="660.0" y="154.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#1d7454">WHP + hypervisor</text><path data-id="edge:invoke" d="M530,265 L670,265" fill="none" stroke="#7d828b" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:return_exit" d="M900,320 L900,400 Q900,410 890,410 L310,410 Q300,410 300,420 L300,480" fill="none" stroke="#7d828b" stroke-width="2" marker-end="url(#arrow)"/><g data-id="node:handle"><rect x="70" y="210" width="460" height="110" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="70" y="222" width="5" height="86" rx="2.5" fill="#fbbf24"/><text x="300.0" y="258.2" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Partition handle + index 0</text><text x="300.0" y="285.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Inputs to each run</text></g><g data-id="node:exit_context"><rect x="70" y="480" width="460" height="130" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="70" y="492" width="5" height="106" rx="2.5" fill="#fbbf24"/><text x="300.0" y="525.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Exit context</text><text x="300.0" y="552.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">ExitReason selects the union</text><text x="300.0" y="578.3" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">IO port / memory / EOI / …</text></g><g data-id="node:virtual_processor"><rect x="670" y="210" width="460" height="110" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1" filter="url(#shadow)"/><rect x="670" y="222" width="5" height="86" rx="2.5" fill="#fbbf24"/><text x="900.0" y="258.2" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#111111">Virtual processor 0</text><text x="900.0" y="285.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#5f6368">Registers persist between runs</text></g><rect x="571.1" y="246.3" width="57.8" height="37.3" rx="6" fill="#f6f5f1"/><text x="600.0" y="272.3" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#3d4148">Run</text><rect x="488.8" y="391.4" width="322.4" height="37.3" rx="6" fill="#ebfbf5"/><text x="650.0" y="417.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#3d4148">fills reason + exit data</text><text x="40.0" y="695.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#5f6368">Key</text><rect x="40.0" y="713" width="18" height="18" rx="4" fill="#fbbf24"/><text x="70.0" y="729.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111">Execution</text><rect x="201.95" y="713" width="18" height="18" rx="4" fill="#34d399"/><text x="231.9" y="729.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#111111">Compute</text></svg>