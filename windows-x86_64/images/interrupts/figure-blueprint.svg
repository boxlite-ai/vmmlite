o-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">IRQ 5</text><rect x="374.8" y="466.4" width="70.4" height="37.3" rx="6" fill="#000000"/><text x="410.0" y="492.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">0x45</text><rect x="761.1" y="466.4" width="57.8" height="37.3" rx="6" fill="#000000"/><text x="790.0" y="492.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">IRQ</text><rect x="582.5" y="196.3" width="335.0" height="37.3" rx="6" fill="#000000"/><text x="750.0" y="222.3" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">InterruptACK lowers IRQ 5</text><rect x="753.3" y="631.4" width="133.4" height="37.3" rx="6" fill="#000000"/><text x="820.0" y="657.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">LAPIC EOI</text><rect x="255.3" y="721.4" width="259.4" height="37.3" rx="6" fill="#000000"/><text x="385.0" y="747.4" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#c7c7c7">EOI exit: rearm pin</text><text x="40.0" y="815.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="600" fill="#a3a3a3">Key</text><rect x="40.0" y="833" width="18" height="18" rx="4" fill="#fbbf24"/><text x="70.0" y="849.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#ffffff">Execution</text><rect x="201.95" y="833" width="18" height="18" rx="4" fill="#34d399"/><text x="231.9" y="849.0" text-anchor="start" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, s