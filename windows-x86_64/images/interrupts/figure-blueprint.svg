<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Illustrative vector 0x45: IRQ 5 reaches the WHP local APIC, Linux acknowledges the device, then EOI lets vmmlite rearm the IOAPIC pin."><title>Interrupts · one level-triggered example</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c8c"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#00b0f0" flood-opacity="0.65"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".08"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern></defs><rect width="100%" height="100%" fill="#000000"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="40.0" y="56.0" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="400" fill="#00b0f0" letter-spacing="3">INTERRUPTS · ONE LEVEL-TRIGGERED EXAMPLE</text><text x="1160.0" y="874.0" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400" fill="#a3a3a3">vmmlite · WHP source 4b049e4d · native boot pending</text><rect data-id="boundary:device_process" x="40" y="100" width="360" height="490" rx="16" fill="#140f03" stroke="#bc8f1b" stroke-width="1.5"/><text x="60.0" y="134.0" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="500" fill="#fbbf24" letter-spacing="1">VMMLITE.EXE</text><rect data-id="boundary:interrupt_engine" x="420" y="350" width="360" height="240" rx="16" fill="#04110c" stroke="#279e73" stroke-width="1.5"/><text x="440.0" y="384.0" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="500" fill="#34d399" letter-spacing="1">WHP</text><rect data-id="boundary:guest" x="800" y="350" width="360" height="240" rx="16" fill="#0b0c0d" stroke="#686f76" stroke-width="1.5"/><text x="820.0" y="384.0" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="500" fill="#8b949e" letter-spacing="1">GUEST</text><path data-id="edge:assert_line" d="M220,270 L220,430" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:inject_vector" d="M370,485 L450,485" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:deliver" d="M750,485 L830,485" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:device_ack" d="M1130,485 L1170,485 Q1180,485 1180,475 L1180,225 Q1180,215 1170,215 L370,215" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:lapic_eoi" d="M980,540 L980,640 Q980,650 970,650 L660,650 Q650,650 650,640 L650,540" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><path data-id="edge:rearm" d="M550,540 L550,730 Q550,740 540,740 L230,740 Q220,740 220,730 L220,540" fill="none" stroke="#8c8c8c" stroke-width="2" marker-end="url(#arrow)"/><g data-id="node:console"><rect x="70" y="160" width="300" height="110" rx="8" fill="#231b05" stroke="#fbbf24" stroke-width="1.2"/><text x="220.0" y="195.1" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#ffffff">Virtio console</text><text x="220.0" y="222.0" text-anchor="middle" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#a3a3a3">TX used ring published</text><text x="220.0" y="248.3" text-anchor="midd